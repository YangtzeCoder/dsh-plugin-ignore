# dsh-plugin-ignore 作为一个 bundle，只做一件事：插入自己的插件条目。
# 安装方式（任选其一）：
#   - dsh plugin --profile desktop add dsh-plugin-ignore
#   - DSH 插件管理页面 / plugin_manager install_bundle，target 传包名或本目录绝对路径
- insert:
    - id: dsh-plugin-ignore
      name: 'dsh-plugin-ignore'
      config:
        ignoreFile: .dshignore
